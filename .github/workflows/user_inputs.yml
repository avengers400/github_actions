name: workflow for user input

on: 
    workflow_dispatch:
        inputs:
          environment:
            description: "Env to Deploy"
            type: environment
            required: true
          notify:
            description: "Notify the  Deployment status"
            type: environment
            default: 'true'

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Deploying to ${{ github.event.inputs.environment}} environment" 
    notify:
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.notify}}
        steps:
            - run: "Deployed to ${{ github.event.inputs.environment}} environment"
            